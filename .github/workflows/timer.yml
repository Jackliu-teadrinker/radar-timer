name: Radar external timer

# 存在的理由：
#   ai-news-radar 是 fork（parent: LearnPrompt/ai-news-radar），GitHub 对 fork 的 schedule
#   触发做限流——2026-11-17 实测 24 个整点机会只命中 1 个（03 点）。
#   GitHub 的 schedule 全局都是 best-effort，即使非 fork 也会延迟/丢弃。
#   所以这里不指望"每次都被调度"：一次触发就在 job 内自我循环 ~5.3 小时，
#   把可靠性要求从"每天 96 次命中"降到"每 5 小时 1 次命中"。

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: '循环拍数（默认 16 拍 × 20min ≈ 5.3h；<4 为测试，不接力）'
        required: false
        default: '16'

permissions:
  contents: write

concurrency:
  group: radar-timer-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Watch freshness in a loop (16 rounds x 20min)
        id: loop
        env:
          RADAR_PAT: ${{ secrets.RADAR_PAT }}
          ROUNDS_IN: ${{ github.event.inputs.rounds || '16' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          TOKEN = os.environ.get("RADAR_PAT", "")
          REPO = "Jackliu-teadrinker/ai-news-radar"
          WF = "update-news.yml"
          STALE_MIN = 22            # 数据超过这个年龄就补一刀（目标节奏 ~25-30min）
          RECENT_WINDOW_SEC = 1500  # 25min 内有 run 就不再派（防级联，也避开自己的上一轮）
          ROUNDS = int(os.environ.get("ROUNDS_IN") or 16)  # 16 x 20min ≈ 5.3h，留在 350min 上限内
          SLEEP_SEC = 1200

          if not TOKEN:
              print("[FATAL] RADAR_PAT 未配置")
              sys.exit(1)

          AUTH = {"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github+json",
                  "User-Agent": "radar-timer/1.0"}

          def get(url, timeout=25, retries=3):
              last = None
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "radar-timer/1.0", "Cache-Control": "no-cache"})
                      return urllib.request.urlopen(req, timeout=timeout).read()
                  except Exception as e:
                      last = e
                      if i < retries - 1:
                          time.sleep(2 * (i + 1))
              raise last

          def freshness():
              age, gen = 9999.0, None
              for url, label in ((
                  "https://jackliu-teadrinker.github.io/ai-news-radar/data/days/index.json", "days-index"), (
                  "https://jackliu-teadrinker.github.io/ai-news-radar/data/latest-24h-min.json", "24h-min")):
                  try:
                      d = json.loads(get(url + f"?cb={int(time.time())}"))
                      g_at = d.get("generated_at")
                      if not g_at:
                          continue
                      g = datetime.fromisoformat(g_at.replace("Z", "+00:00"))
                      a = (datetime.now(timezone.utc) - g).total_seconds() / 60
                      print(f"[freshness] {label}: generated_at={g_at} age={a:.0f}min")
                      if a < age:
                          age, gen = a, g_at
                  except Exception as e:
                      print(f"[freshness] {label} failed: {e}")
              return age, gen

          def busy_runs():
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{REPO}/actions/workflows/{WF}/runs?per_page=15",
                      headers=AUTH)
                  runs = json.loads(urllib.request.urlopen(req, timeout=25).read())["workflow_runs"]
                  cutoff = datetime.now(timezone.utc).timestamp() - RECENT_WINDOW_SEC
                  return sum(1 for r in runs
                             if r["status"] in ("queued", "in_progress", "waiting")
                             or datetime.fromisoformat(
                                 r["created_at"].replace("Z", "+00:00")).timestamp() > cutoff)
              except Exception as e:
                  print(f"[busy-check] failed (放行): {e}")
                  return 0

          def dispatch():
              body = json.dumps({"ref": "master"}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/workflows/{WF}/dispatches",
                  data=body, method="POST",
                  headers={**AUTH, "Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=25)

          for rnd in range(1, ROUNDS + 1):
              print(f"=== round {rnd}/{ROUNDS} {datetime.now(timezone.utc).strftime('%H:%M:%S')}Z")
              age, gen = freshness()
              stale = age > STALE_MIN
              print(f"[freshness] youngest age={age:.0f}min stale={stale} (threshold {STALE_MIN}min)")
              busy = busy_runs()
              print(f"[busy-check] active/recent runs: {busy}")

              if stale and busy == 0:
                  print(f"[rescue] stale {age:.0f}min and idle -> dispatch {WF}")
                  try:
                      dispatch()
                      print("[rescue] dispatched OK")
                  except urllib.error.HTTPError as e:
                      print(f"[rescue] dispatch FAILED: {e.code} {e.read()[:200]}")
                  except Exception as e:
                      print(f"[rescue] dispatch FAILED: {e}")
              elif stale:
                  print(f"[rescue] stale but {busy} run(s) active/recent -> skip")
              else:
                  print("[rescue] data fresh, nothing to do")

              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"- round {rnd}: age={age:.0f}min stale={stale} busy={busy}\n")

              if rnd < ROUNDS:
                  time.sleep(SLEEP_SEC)
          print("[done] loop finished")
          PY

      - name: Chain next run (self-sustaining, schedule-independent)
        # GitHub 对本账号的 schedule 限流极重（fork 1/24 命中；非 fork 新仓 85min 0 命中），
        # 所以不靠 schedule：一轮 5.3h 结束后用 PAT 派自己一次，形成永续接力。
        # 只在前一轮真正跑完（success）时接力，避免启动即崩导致死循环。
        if: always() && steps.loop.outcome == 'success'
        env:
          RADAR_PAT: ${{ secrets.RADAR_PAT }}
          ROUNDS_IN: ${{ github.event.inputs.rounds || '16' }}
        run: |
          if [ "${ROUNDS_IN:-16}" -lt 4 ]; then
            echo "short test run (rounds=$ROUNDS_IN) -> skip chaining"
            exit 0
          fi
          code=$(curl -sS -o /tmp/chain.out -w "%{http_code}" -X POST             -H "Authorization: token $RADAR_PAT"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/Jackliu-teadrinker/radar-timer/actions/workflows/timer.yml/dispatches             -d '{"ref":"main"}')
          echo "chain dispatch: HTTP $code"
          cat /tmp/chain.out || true
          [ "$code" = "204" ] || exit 1

      - name: Keepalive (avoid 60-day inactivity disable)
        if: always()
        run: |
          # GitHub 会停用 60 天无推送仓库的 schedule；每 7 天写一次心跳文件
          last=$(git log -1 --format=%ct -- heartbeat.txt 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ $(( now - last )) -gt 604800 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
            git config user.name "radar-timer"
            git config user.email "radar-timer@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "[timer] heartbeat $(date -u +%F)"
            git push
          else
            echo "heartbeat fresh, skip"
          fi
